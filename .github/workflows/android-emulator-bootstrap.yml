name: Android Emulator Bootstrap Test

on:
  pull_request:
    paths:
      - "android-app/**"
      - "scripts/test-bootstrap-emulator.sh"
      - ".github/workflows/android-emulator-bootstrap.yml"
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - "scripts/test-bootstrap-emulator.sh"
      - ".github/workflows/android-emulator-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-emulator:
    name: Embedded Bootstrap on Android 15 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

      - name: Install build SDK, NDK, CMake, and emulator image
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            "system-images;android-35;google_apis;x86_64"

      - name: Build debug APK
        working-directory: android-app
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleDebug

      - name: Run Bootstrap test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./scripts/test-bootstrap-emulator.sh --wait 90

      - name: Upload Bootstrap diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-emulator-logcat-${{ github.run_id }}
          path: |
            bootstrap-emulator-logcat.txt
            android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
